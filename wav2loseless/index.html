<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wav → lossless video</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #c8f560;
    --accent2: #4af0c4;
    --text: #e8e8e8;
    --muted: #555;
    --danger: #ff5f5f;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  /* scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(200,245,96,0.25);
  }

  h1 span { color: var(--text); }

  .subtitle {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 28px;
    width: 100%;
    max-width: 640px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* drop zone */
  #dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 2px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }

  #dropzone:hover, #dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(200,245,96,0.04);
  }

  #dropzone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    font-size: 2rem;
    margin-bottom: 10px;
    display: block;
  }

  .drop-text {
    font-size: 0.8rem;
    color: var(--muted);
  }

  #file-list {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .file-item {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 8px 12px;
    font-size: 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .file-item .fname { color: var(--text); }
  .file-item .fsize { color: var(--muted); }

  /* options */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .opt-group { display: flex; flex-direction: column; gap: 6px; }

  label.opt-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  select, input[type=color] {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    padding: 8px 10px;
    width: 100%;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  select:focus, select:hover { border-color: var(--accent2); }

  /* background image */
  #img-option {
    display: none;
    flex-direction: column;
    gap: 6px;
  }

  #img-preview {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border: 1px solid var(--border);
    border-radius: 2px;
    display: none;
    margin-top: 4px;
  }

  /* color picker wrapper */
  .color-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  input[type=color] {
    width: 40px;
    padding: 2px;
    height: 36px;
    flex-shrink: 0;
  }

  #color-hex {
    flex: 1;
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    padding: 8px 10px;
    outline: none;
  }

  /* resolution */
  .res-row { display: flex; gap: 8px; }
  .res-row input {
    flex: 1;
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    padding: 8px 10px;
    outline: none;
    text-align: center;
  }
  .res-row span { display: flex; align-items: center; color: var(--muted); font-size: 0.9rem; }

  /* convert btn */
  #convert-btn {
    width: 100%;
    max-width: 640px;
    padding: 16px;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 2px;
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.2s;
    margin-bottom: 16px;
  }

  #convert-btn:hover:not(:disabled) { background: #d9ff6e; transform: translateY(-1px); }
  #convert-btn:active:not(:disabled) { transform: translateY(0); }
  #convert-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* log */
  #log-card { display: none; }

  #log {
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 14px;
    font-size: 0.72rem;
    color: #aaa;
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.7;
  }

  #log .ok { color: var(--accent); }
  #log .info { color: var(--accent2); }
  #log .err { color: var(--danger); }

  /* progress */
  .progress-wrap {
    margin-top: 12px;
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 2px;
    height: 4px;
    overflow: hidden;
    display: none;
  }

  #progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
  }

  /* downloads */
  #downloads { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

  .dl-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d1a0d;
    border: 1px solid #1e3a1e;
    border-radius: 2px;
    padding: 10px 14px;
    text-decoration: none;
    font-size: 0.78rem;
    color: var(--accent);
    transition: background 0.15s;
  }

  .dl-item:hover { background: #111f11; }
  .dl-item .dl-name { flex: 1; }
  .dl-item .dl-size { color: var(--muted); margin: 0 12px; }
  .dl-item .dl-arrow { font-size: 1rem; }

  /* note */
  .note {
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.6;
    padding-top: 8px;
  }
  .note strong { color: #888; }

  /* loading state on button */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #0a0a0a;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 500px) {
    .options-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1><span>wav →</span> lossless<br>video</h1>
  <p class="subtitle">client-side · ffmpeg.wasm · sem servidor</p>
</header>

<!-- drop -->
<div class="card">
  <div class="section-label">01 — arquivos wav</div>
  <div id="dropzone">
    <input type="file" id="file-input" accept=".wav,audio/wav" multiple>
    <span class="drop-icon">🎵</span>
    <div class="drop-text">solte arquivos .wav aqui ou clique pra selecionar</div>
  </div>
  <div id="file-list"></div>
</div>

<!-- options -->
<div class="card">
  <div class="section-label">02 — opções de saída</div>
  <div class="options-grid">

    <div class="opt-group">
      <label class="opt-label" for="format-select">formato</label>
      <select id="format-select">
        <option value="mkv">MKV + FLAC (recomendado)</option>
        <option value="mov">MOV + PCM s24le</option>
      </select>
    </div>

    <div class="opt-group">
      <label class="opt-label" for="bg-select">fundo do vídeo</label>
      <select id="bg-select">
        <option value="black">tela preta</option>
        <option value="color">cor sólida</option>
        <option value="image">imagem</option>
      </select>
    </div>

    <div class="opt-group" id="color-group" style="display:none;">
      <label class="opt-label">cor de fundo</label>
      <div class="color-row">
        <input type="color" id="bg-color" value="#1a1a2e">
        <input type="text" id="color-hex" value="#1a1a2e" maxlength="7">
      </div>
    </div>

    <div class="opt-group" id="img-option">
      <label class="opt-label">imagem de fundo</label>
      <input type="file" id="img-input" accept="image/*" style="background:#161616;border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.72rem;padding:8px;width:100%;cursor:pointer;">
      <img id="img-preview" alt="preview">
    </div>

    <div class="opt-group">
      <label class="opt-label">resolução</label>
      <div class="res-row">
        <input type="number" id="res-w" value="1280" min="16" max="7680">
        <span>×</span>
        <input type="number" id="res-h" value="720" min="16" max="4320">
      </div>
    </div>

    <div class="opt-group">
      <label class="opt-label" for="fps-select">fps</label>
      <select id="fps-select">
        <option value="1">1 fps (menor arquivo)</option>
        <option value="24" selected>24 fps</option>
        <option value="30">30 fps</option>
      </select>
    </div>

  </div>

  <p class="note" style="margin-top:14px;">
    <strong>MKV+FLAC</strong>: compressão lossless, ampla compatibilidade.<br>
    <strong>MOV+PCM</strong>: PCM s24le sem compressão nenhuma, arquivo maior.
  </p>
</div>

<button id="convert-btn" disabled>converter</button>

<!-- log + downloads -->
<div class="card" id="log-card">
  <div class="section-label">log</div>
  <div id="log"></div>
  <div class="progress-wrap" id="progress-wrap">
    <div id="progress-bar"></div>
  </div>
  <div id="downloads"></div>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────────────
let files = [];
let bgImageData = null; // base64 png
let ffmpegReady = false;
let ffmpeg = null;

// ── ffmpeg.wasm (v0.12 CDN) ────────────────────────────────────────────────
const { createFFmpeg, fetchFile } = FFmpegWASM;

async function loadFFmpeg() {
  log('info', 'carregando ffmpeg.wasm...');
  ffmpeg = createFFmpeg({
    log: false,
    corePath: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
  });
  ffmpeg.setLogger(({ type, message }) => {
    if (type === 'fferr' && message.includes('time=')) {
      // parse progress
      const m = message.match(/time=(\d+):(\d+):(\d+\.\d+)/);
      if (m) {
        // handled per-file below
      }
    }
  });
  await ffmpeg.load();
  ffmpegReady = true;
  log('ok', 'ffmpeg.wasm pronto');
}

// lazy load on first convert
let ffmpegLoading = false;

// ── UI helpers ─────────────────────────────────────────────────────────────
function log(type, msg) {
  const el = document.getElementById('log');
  const card = document.getElementById('log-card');
  card.style.display = '';
  const line = document.createElement('div');
  line.className = type;
  const ts = new Date().toLocaleTimeString('pt-BR', { hour12: false });
  line.textContent = `[${ts}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setProgress(pct) {
  document.getElementById('progress-wrap').style.display = '';
  document.getElementById('progress-bar').style.width = pct + '%';
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024**2) return (b/1024).toFixed(1) + ' KB';
  return (b/1024**2).toFixed(2) + ' MB';
}

function updateBtn() {
  document.getElementById('convert-btn').disabled = files.length === 0;
}

function renderFileList() {
  const el = document.getElementById('file-list');
  el.innerHTML = '';
  files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    div.innerHTML = `<span class="fname">${f.name}</span><span class="fsize">${fmtBytes(f.size)}</span>`;
    el.appendChild(div);
  });
}

// ── drop zone ──────────────────────────────────────────────────────────────
const dz = document.getElementById('dropzone');
const fi = document.getElementById('file-input');

fi.addEventListener('change', () => {
  files = Array.from(fi.files).filter(f => f.name.toLowerCase().endsWith('.wav'));
  renderFileList();
  updateBtn();
});

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  const dropped = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.wav'));
  files = dropped;
  renderFileList();
  updateBtn();
});

// ── bg select ─────────────────────────────────────────────────────────────
document.getElementById('bg-select').addEventListener('change', function() {
  document.getElementById('color-group').style.display = this.value === 'color' ? '' : 'none';
  document.getElementById('img-option').style.display = this.value === 'image' ? 'flex' : 'none';
});

// color sync
document.getElementById('bg-color').addEventListener('input', function() {
  document.getElementById('color-hex').value = this.value;
});
document.getElementById('color-hex').addEventListener('input', function() {
  const v = this.value;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('bg-color').value = v;
});

// image preview
document.getElementById('img-input').addEventListener('change', function() {
  const f = this.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    bgImageData = e.target.result; // data URL
    const prev = document.getElementById('img-preview');
    prev.src = bgImageData;
    prev.style.display = '';
  };
  reader.readAsDataURL(f);
});

// ── convert ────────────────────────────────────────────────────────────────
document.getElementById('convert-btn').addEventListener('click', async () => {
  if (files.length === 0) return;

  const btn = document.getElementById('convert-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>processando...';

  document.getElementById('downloads').innerHTML = '';
  document.getElementById('log').innerHTML = '';
  document.getElementById('log-card').style.display = '';

  const format = document.getElementById('format-select').value;
  const bgMode = document.getElementById('bg-select').value;
  const resW = parseInt(document.getElementById('res-w').value) || 1280;
  const resH = parseInt(document.getElementById('res-h').value) || 720;
  const fps = parseInt(document.getElementById('fps-select').value) || 24;

  // ensure even dimensions (libx264 requirement)
  const w = resW % 2 === 0 ? resW : resW + 1;
  const h = resH % 2 === 0 ? resH : resH + 1;

  // load ffmpeg if needed
  if (!ffmpegReady) {
    if (ffmpegLoading) return;
    ffmpegLoading = true;
    try { await loadFFmpeg(); }
    catch(e) { log('err', 'falha ao carregar ffmpeg: ' + e.message); btn.disabled = false; btn.textContent = 'converter'; return; }
  }

  // prepare bg image if needed
  let imgFileName = null;
  if (bgMode === 'image' && bgImageData) {
    // convert data url to uint8array
    const res = await fetch(bgImageData);
    const blob = await res.blob();
    const ab = await blob.arrayBuffer();
    ffmpeg.FS('writeFile', 'bg.png', new Uint8Array(ab));
    imgFileName = 'bg.png';
  }

  const ext = format === 'mkv' ? 'mkv' : 'mov';
  const downloads = document.getElementById('downloads');

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const baseName = file.name.replace(/\.wav$/i, '');
    const outName = baseName + '.' + ext;
    log('info', `[${i+1}/${files.length}] processando: ${file.name}`);
    setProgress(0);

    try {
      // write wav
      ffmpeg.FS('writeFile', 'input.wav', await fetchFile(file));

      // build filter for video source
      let videoInput, videoArgs;

      if (bgMode === 'image' && imgFileName) {
        // scale image to target res, loop it
        videoInput = ['-loop', '1', '-i', imgFileName];
        videoArgs = ['-vf', `scale=${w}:${h}:force_original_aspect_ratio=decrease,pad=${w}:${h}:(ow-iw)/2:(oh-ih)/2`];
      } else {
        // solid color (black = #000000, or custom)
        let color = '0x000000';
        if (bgMode === 'color') {
          const hex = document.getElementById('bg-color').value.replace('#', '');
          color = '0x' + hex;
        }
        videoInput = ['-f', 'lavfi', '-i', `color=c=${color}:s=${w}x${h}:r=${fps}`];
        videoArgs = [];
      }

      // audio + video codec args
      let audioArgs, videoCodecArgs;

      if (format === 'mkv') {
        audioArgs = ['-c:a', 'flac'];
        videoCodecArgs = ['-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '0', '-pix_fmt', 'yuv420p'];
      } else {
        // mov + pcm s24le
        audioArgs = ['-c:a', 'pcm_s24le'];
        videoCodecArgs = ['-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '0', '-pix_fmt', 'yuv420p'];
      }

      // track progress via duration
      let duration = 0;
      ffmpeg.setLogger(({ type, message }) => {
        if (type === 'fferr') {
          const dm = message.match(/Duration:\s*(\d+):(\d+):(\d+\.\d+)/);
          if (dm) duration = parseInt(dm[1])*3600 + parseInt(dm[2])*60 + parseFloat(dm[3]);
          const tm = message.match(/time=(\d+):(\d+):(\d+\.\d+)/);
          if (tm && duration > 0) {
            const cur = parseInt(tm[1])*3600 + parseInt(tm[2])*60 + parseFloat(tm[3]);
            setProgress(Math.min(99, (cur/duration)*100));
          }
        }
      });

      const cmd = [
        ...videoInput,
        '-i', 'input.wav',
        ...videoArgs,
        ...videoCodecArgs,
        ...audioArgs,
        '-shortest',
        '-r', String(fps),
        '-y', 'output.' + ext
      ];

      log('info', 'ffmpeg: ' + cmd.join(' '));
      await ffmpeg.run(...cmd);
      setProgress(100);

      const data = ffmpeg.FS('readFile', 'output.' + ext);
      const mimeType = format === 'mkv' ? 'video/x-matroska' : 'video/quicktime';
      const blob = new Blob([data.buffer], { type: mimeType });
      const url = URL.createObjectURL(blob);

      // cleanup
      ffmpeg.FS('unlink', 'input.wav');
      try { ffmpeg.FS('unlink', 'output.' + ext); } catch(e) {}

      log('ok', `✓ ${outName} — ${fmtBytes(blob.size)}`);

      const a = document.createElement('a');
      a.className = 'dl-item';
      a.href = url;
      a.download = outName;
      a.innerHTML = `<span class="dl-name">${outName}</span><span class="dl-size">${fmtBytes(blob.size)}</span><span class="dl-arrow">↓</span>`;
      downloads.appendChild(a);

    } catch(e) {
      log('err', `erro em ${file.name}: ${e.message}`);
      setProgress(0);
    }
  }

  // cleanup bg
  if (imgFileName) try { ffmpeg.FS('unlink', imgFileName); } catch(e) {}

  btn.disabled = false;
  btn.textContent = 'converter';
  log('ok', 'concluído.');
});
</script>

<!-- ffmpeg.wasm CDN -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script>
// alias para o script acima (0.12 usa namespace diferente)
window.FFmpegWASM = window.FFmpeg;
</script>

</body>
</html>
